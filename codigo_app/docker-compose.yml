services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adminuser
      POSTGRES_PASSWORD: PasswordSegura123!
      POSTGRES_DB: tareasdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adminuser -d tareasdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Esta misma variable luego vendrá de Azure Key Vault
      DATABASE_URL: postgresql://adminuser:PasswordSegura123!@db:5432/tareasdb
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro