name: Build, Scan and Deploy App

on:
  push:
    branches:
      - main
    paths:
      - 'codigo_app/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: acrfullstackbhu5q3
  ACR_SERVER: acrfullstackbhu5q3.azurecr.io
  RESOURCE_GROUP: rg-fullstack-dev-eastus2

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies and Tools
        run: |
          pip install -r codigo_app/backend/requirements.txt pytest httpx ruff

      - name: Run Ruff Linter
        run: |
          ruff check codigo_app/backend

      - name: Lint Backend Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./codigo_app/backend/Dockerfile
          failure-threshold: error

      - name: Lint Frontend Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./codigo_app/frontend/Dockerfile
          failure-threshold: error

      - name: Run Pytest Unit Tests
        run: |
          pytest codigo_app/backend -v

  build-scan-deploy:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name $ACR_NAME

      - name: Build Docker Images
        run: |
          docker build -t $ACR_SERVER/fullstack-backend:${{ github.sha }} ./codigo_app/backend
          docker build -t $ACR_SERVER/fullstack-frontend:${{ github.sha }} ./codigo_app/frontend

      - name: Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ACR_SERVER }}/fullstack-backend:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Scan Frontend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ACR_SERVER }}/fullstack-frontend:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Push Docker Images to ACR
        run: |
          docker push $ACR_SERVER/fullstack-backend:${{ github.sha }}
          docker push $ACR_SERVER/fullstack-frontend:${{ github.sha }}

      - name: Deploy and Validate Backend (Zero-Downtime)
        run: |
          SUFFIX="rev-${{ github.run_number }}-${{ github.run_attempt }}"
          REV_NAME="api-backend--$SUFFIX"

          az containerapp update --name api-backend --resource-group $RESOURCE_GROUP --image $ACR_SERVER/fullstack-backend:${{ github.sha }} --revision-suffix "$SUFFIX"

          REV_FQDN=$(az containerapp revision show --name api-backend --resource-group $RESOURCE_GROUP --revision "$REV_NAME" --query "properties.fqdn" -o tsv)

          curl --fail --retry 5 --retry-delay 5 --retry-all-errors "https://$REV_FQDN/health"

          az containerapp ingress traffic set --name api-backend --resource-group $RESOURCE_GROUP --revision-weight "$REV_NAME=100"

      - name: Deploy and Validate Frontend (Zero-Downtime)
        run: |
          SUFFIX="rev-${{ github.run_number }}-${{ github.run_attempt }}"
          REV_NAME="web-frontend--$SUFFIX"

          az containerapp update --name web-frontend --resource-group $RESOURCE_GROUP --image $ACR_SERVER/fullstack-frontend:${{ github.sha }} --revision-suffix "$SUFFIX"

          FRONT_REV_FQDN=$(az containerapp revision show --name web-frontend --resource-group $RESOURCE_GROUP --revision "$REV_NAME" --query "properties.fqdn" -o tsv)

          curl --fail --retry 5 --retry-delay 5 --retry-all-errors "https://$FRONT_REV_FQDN"

          az containerapp ingress traffic set --name web-frontend --resource-group $RESOURCE_GROUP --revision-weight "$REV_NAME=100"
