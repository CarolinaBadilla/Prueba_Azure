name: Build, Scan and Deploy App

on:
  push:
    branches:
      - main
    paths:
      - 'codigo_app/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: acrfullstackbhu5q3
  ACR_SERVER: acrfullstackbhu5q3.azurecr.io
  RESOURCE_GROUP: rg-fullstack-dev-eastus2

jobs:
  build-scan-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name $ACR_NAME

      - name: Build Docker Images
        run: |
          docker build -t $ACR_SERVER/fullstack-backend:${{ github.sha }} ./codigo_app/backend
          docker build -t $ACR_SERVER/fullstack-frontend:${{ github.sha }} ./codigo_app/frontend

      - name: Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ACR_SERVER }}/fullstack-backend:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Scan Frontend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ACR_SERVER }}/fullstack-frontend:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Push Docker Images to ACR
        run: |
          docker push $ACR_SERVER/fullstack-backend:${{ github.sha }}
          docker push $ACR_SERVER/fullstack-frontend:${{ github.sha }}

      - name: Update Azure Container Apps Revisions
        run: |
          az containerapp update --name api-backend --resource-group $RESOURCE_GROUP --image $ACR_SERVER/fullstack-backend:${{ github.sha }}
          az containerapp update --name web-frontend --resource-group $RESOURCE_GROUP --image $ACR_SERVER/fullstack-frontend:${{ github.sha }}
